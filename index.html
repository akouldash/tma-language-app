<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Language Learning TMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }
    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --accent-color: #0284c7;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; user-select: none; }
    .container { padding: 16px; max-width: 480px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; }
    .nav-item { border: none; background: none; color: var(--text-color); opacity: 0.6; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .nav-item.active { opacity: 1; color: var(--accent-color); font-weight: bold; }
    .btn { width: 100%; padding: 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body data-theme="dark">
  <div class="container">
    <!-- Dashboard Tab -->
    <div id="tab-dashboard" class="tab-content active">
      <div class="card">
        <h3>📊 وضعیت یادگیری</h3>
        <p style="margin-top: 8px; opacity: 0.8;">تا ۱۵ روز دیگر می‌توانید داستان‌های کوتاه بخوانید.</p>
      </div>
      <div class="card">
        <p>⏳ **دوره تست رایگان:** ۶ روز باقی مانده</p>
      </div>
    </div>

    <!-- Learn Tab -->
    <div id="tab-learn" class="tab-content">
      <div class="card">
        <h3>🎯 درس امروز</h3>
        <p style="margin: 8px 0;">شروع مسیر اختصاصی هوش مصنوعی</p>
        <button class="btn" onclick="alert('اتصال به n8n در فاز بعدی انجام می‌شود')">شروع تمرین</button>
      </div>
    </div>

    <!-- Profile Tab -->
    <div id="tab-profile" class="tab-content">
      <div class="card">
        <h3>👤 پروفایل کاربر</h3>
        <p id="user-info" style="margin-top: 8px;">در حال دریافت اطلاعات تلگرام...</p>
      </div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-content">
      <div class="card">
        <h3>⚙️ تنظیمات</h3>
        <button class="btn" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color);" onclick="toggleTheme()">تغییر تم (دارک / لایت)</button>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('dashboard', this)">🏠<span>داشبورد</span></button>
    <button class="nav-item" onclick="switchTab('learn', this)">📚<span>آموزش</span></button>
    <button class="nav-item" onclick="switchTab('profile', this)">👤<span>پروفایل</span></button>
    <button class="nav-item" onclick="switchTab('settings', this)">⚙️<span>تنظیمات</span></button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('user-info').innerText = `کاربر: ${tg.initDataUnsafe.user.first_name}`;
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      el.classList.add('active');
    }

    function toggleTheme() {
      const body = document.body;
      const current = body.getAttribute('data-theme');
      body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }
  </script>
</body>
</html>
